<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open MDB — Mobile Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body { background: #000; color: #f5f5f5; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 92px; }
  ::-webkit-scrollbar { display: none; }

  header { position: sticky; top: 0; z-index: 50; background: #000; display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 26px; height: 26px; stroke: #10b981; fill: none; stroke-width: 1.9; }
  .brand b { font-size: 15px; font-weight: 800; letter-spacing: .02em; }
  .tabs { display: flex; gap: 8px; flex: 1; justify-content: flex-end; }
  .tab { text-align: center; padding: 11px 14px; border-radius: 999px; background: #1a1a1c; color: #d4d4d8; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .tab.active { background: #10b981; color: #04110c; }

  main { padding: 6px 12px; }
  .rowcard { background: #101012; border-radius: 26px; padding: 18px 16px 16px; margin-bottom: 16px; }
  .rowhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .rowhead h2 { font-size: 24px; font-weight: 700; }
  .rowmeta { display: flex; align-items: center; gap: 8px; color: #a1a1aa; font-size: 18px; }
  .rowmeta .track { width: 64px; height: 5px; border-radius: 4px; background: #27272a; overflow: hidden; }
  .rowmeta .track i { display: block; height: 100%; border-radius: 4px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot { background: #141416; border: 1.5px solid #2a2a2e; border-radius: 18px; padding: 14px 10px 12px; text-align: center; display: flex; flex-direction: column; gap: 6px; min-height: 128px; }
  .slot.warn { border-color: #6d5416; }
  .slot.crit { border-color: #6f2222; }
  .slot .sel { font-size: 19px; font-weight: 700; }
  .slot .prod { font-size: 13px; color: #a1a1aa; line-height: 1.25; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .slot .qty { font-size: 24px; font-weight: 800; }
  .slot .qty small { font-size: 14px; font-weight: 600; color: #71717a; }
  .slot .bar { height: 5px; border-radius: 4px; background: #27272a; overflow: hidden; }
  .slot .bar i { display: block; height: 100%; border-radius: 4px; }
  .ok    { color: #e4e4e7; } .ok.fill    { background: #10b981; }
  .low   { color: #facc15; } .low.fill   { background: #facc15; }
  .out   { color: #f87171; } .out.fill   { background: #f87171; }

  .statrow { display: flex; gap: 10px; margin: 4px 0 16px; }
  .stat { flex: 1; background: #101012; border-radius: 20px; padding: 14px; }
  .stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #71717a; margin-bottom: 6px; }
  .stat .v { font-size: 24px; font-weight: 800; color: #34d399; }
  .stat .v.white { color: #f4f4f5; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: #101012; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; }
  .item .body { flex: 1; min-width: 0; }
  .item .t { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .item .s { font-size: 13px; color: #71717a; margin-top: 3px; }
  .item .right { text-align: right; }
  .item .price { font-size: 17px; font-weight: 700; color: #34d399; }
  .item .ago { font-size: 12px; color: #71717a; margin-top: 3px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #1e293b; color: #7dd3fc; margin-right: 6px; }
  .qtybadge { min-width: 44px; text-align: center; font-size: 18px; font-weight: 800; padding: 8px 10px; border-radius: 12px; background: #052e22; color: #34d399; }
  .qtybadge.zero { background: #27272a; color: #71717a; }
  .sect { font-size: 21px; font-weight: 700; margin: 18px 4px 12px; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: #0a0a0b; border-top: 1px solid #1c1c1f; display: flex; padding: 10px 6px 22px; }
  nav .nb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #71717a; font-size: 13px; font-weight: 600; cursor: pointer; }
  nav .nb svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  nav .nb.active { color: #10b981; }
</style>

"Salted Chips 1oz","qty":28,"unit":"units"},{"name":"Cola 12oz","qty":25,"unit":"cans/bottles"},{"name":"Lemon-Lime 12oz","qty":24,"unit":"cans/bottles"},{"name":"Root Beer 12oz","qty":16,"unit":"cans/bottles"},{"name":"BBQ Chips 1oz","qty":5,"unit":"units"},{"name":"Energy Drink 16oz","qty":4,"unit":"cans/bottles"},{"name":"Cheese Puffs 1.25oz","qty":0,"unit":"units"}],"products":["Cola 12oz","Lemon-Lime 12oz","Root Beer 12oz","Bottled Water 16.9oz","Energy Drink 16oz","Sugar-Free Energy 16oz","Salted Chips 1oz","BBQ Chips 1oz","Cheese Puffs 1.25oz","Chocolate Bar","Peanut Bar","Fruit Chews"]};
let machine = DATA.machines[0].id;
let view = "inventory";

const ICONS = {
  inventory: '<svg viewBox="0 0 24 24"><path d="M21 8.5v7a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 15.5v-7a2 2 0 0 1 1-1.73l7-4a2 2 0 0 1 2 0l7 4a2 2 0 0 1 1 1.73z"/><path d="M3.3 7.3 12 12.3l8.7-5"/><path d="M12 22V12"/></svg>',
  vends: '<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
  storage: '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M5 8V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M9 12h6"/></svg>',
  products: '<svg viewBox="0 0 24 24"><path d="M20.6 13.4 11 3.8A2 2 0 0 0 9.6 3.2H5a2 2 0 0 0-2 2v4.6c0 .53.2 1 .59 1.4l9.6 9.6a2 2 0 0 0 2.82 0l4.6-4.6a2 2 0 0 0 0-2.82z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>',
};

const machName = (id) => (DATA.machines.find((m) => m.id === id) || { name: id }).name;
const cents = (c) => c == null ? "—" : "$" + (c / 100).toFixed(2);
function ago(ts) {
  const s = Math.max(1, Math.floor((Date.now() - new Date(ts)) / 1000));
  if (s < 60) return s + "s ago";
  const mn = Math.floor(s / 60); if (mn < 60) return mn + "m ago";
  const h = Math.floor(mn / 60); if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}
const cls = (cur, max) => cur <= 0 ? "out" : (cur / max) <= 0.5 ? "low" : "ok";

function renderTabs() {
  document.getElementById("tabs").innerHTML = DATA.machines.map((m) =>
    '<div class="tab' + (m.id === machine ? " active" : "") + '" data-m="' + m.id + '">' + m.name + "</div>").join("");
  document.querySelectorAll(".tab").forEach((el) =>
    el.addEventListener("click", () => { machine = el.dataset.m; render(); window.scrollTo(0, 0); }));
}
function renderNav() {
  document.getElementById("nav").innerHTML = ["inventory", "vends", "storage", "products"].map((v) =>
    '<div class="nb' + (v === view ? " active" : "") + '" data-v="' + v + '">' + ICONS[v] +
    "<span>" + v[0].toUpperCase() + v.slice(1) + "</span></div>").join("");
  document.querySelectorAll(".nb").forEach((el) =>
    el.addEventListener("click", () => { view = el.dataset.v; render(); window.scrollTo(0, 0); }));
}
function invHTML() {
  const rows = {};
  DATA.slots.filter((s) => s.machine_id === machine).forEach((s) => {
    const key = String(Math.floor(parseInt(s.sel, 10) / 10) * 10);
    (rows[key] = rows[key] || []).push(s);
  });
  const keys = Object.keys(rows).sort((a, b) => a - b);
  return keys.map((k, i) => {
    const list = rows[k].sort((a, b) => a.sel - b.sel);
    const cur = list.reduce((n, s) => n + s.cur, 0), max = list.reduce((n, s) => n + s.max, 0);
    const rcls = cls(cur, max);
    return '<div class="rowcard"><div class="rowhead"><h2>Row ' + (i + 1) + "</h2>" +
      '<div class="rowmeta"><span>' + cur + "/" + max + '</span><span class="track"><i class="' + rcls + ' fill" style="width:' + Math.round((cur / max) * 100) + '%"></i></span></div></div>' +
      '<div class="grid">' + list.map((s) => {
        const c = cls(s.cur, s.max);
        const border = c === "out" ? "crit" : c === "low" ? "warn" : "";
        return '<div class="slot ' + border + '"><div class="sel">' + s.sel + '</div><div class="prod">' + s.product +
          '</div><div class="qty ' + c + '">' + s.cur + "<small>/" + s.max + "</small></div>" +
          '<div class="bar"><i class="' + c + ' fill" style="width:' + Math.min(100, Math.round((s.cur / s.max) * 100)) + '%"></i></div></div>';
      }).join("") + "</div></div>";
  }).join("");
}
function vendsHTML() {
  const list = DATA.vends.filter((v) => v.machine_id === machine).slice(0, 40);
  const day = 86400000, now = Date.now();
  const rev = (ms) => cents(DATA.vends.filter((v) => v.machine_id === machine && now - new Date(v.ts) < ms).reduce((n, v) => n + (v.price || 0), 0));
  return '<div class="statrow"><div class="stat"><div class="k">Today</div><div class="v">' + rev(now - new Date().setHours(0,0,0,0)) +
    '</div></div><div class="stat"><div class="k">7 days</div><div class="v">' + rev(7 * day) +
    '</div></div><div class="stat"><div class="k">30 days</div><div class="v white">' + rev(30 * day) + "</div></div></div>" +
    '<div class="list">' + list.map((v) =>
      '<div class="item"><div class="body"><div class="t">' + v.product + '</div><div class="s"><span class="chip">' + machName(v.machine_id) + "</span>" + (v.pay || "") +
      '</div></div><div class="right"><div class="price">' + cents(v.price) + '</div><div class="ago">' + ago(v.ts) + "</div></div></div>").join("") + "</div>";
}
function storageHTML() {
  const inStock = DATA.storage.filter((s) => s.qty > 0);
  const out = DATA.storage.filter((s) => s.qty <= 0);
  const item = (s) => '<div class="item"><div class="body"><div class="t">' + s.name + '</div><div class="s">' + s.unit + '</div></div><div class="qtybadge' + (s.qty <= 0 ? " zero" : "") + '">' + s.qty + "</div></div>";
  return '<div class="statrow"><div class="stat"><div class="k">SKUs in storage</div><div class="v">' + inStock.length +
    '</div></div><div class="stat"><div class="k">Total units</div><div class="v white">' + inStock.reduce((n, s) => n + s.qty, 0) + "</div></div></div>" +
    '<div class="sect">In stock</div><div class="list">' + inStock.map(item).join("") + "</div>" +
    (out.length ? '<div class="sect">Out of stock</div><div class="list">' + out.map(item).join("") + "</div>" : "");
}
function productsHTML() {
  return '<div class="statrow"><div class="stat"><div class="k">Catalog</div><div class="v white">' + DATA.products.length + ' products</div></div></div>' +
    '<div class="list">' + DATA.products.map((p) => '<div class="item"><div class="body"><div class="t">' + p + "</div></div></div>").join("") + "</div>";
}
function render() {
  renderTabs(); renderNav();
  const el = document.getElementById("main");
  el.innerHTML = view === "inventory" ? invHTML() : view === "vends" ? vendsHTML() : view === "storage" ? storageHTML() : productsHTML();
}
render();
</script>
